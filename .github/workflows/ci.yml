name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate credential-free local config on Linux
        run: npm exec -- varlock load --agent
        env:
          ROOMFORM_LOCAL: "true"
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run fmt:check
